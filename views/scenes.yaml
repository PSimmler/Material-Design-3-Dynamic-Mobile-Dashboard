- type: grid
  cards:
    - type: custom:mushroom-title-card
      subtitle: Select an active room to view available scenes
      title: ""
    
    # DYNAMIC SCENE GENERATOR
    - type: custom:auto-entities
      card:
        type: custom:layout-card
        layout_type: custom:grid-layout # Use grid for side-by-side buttons
        layout:
          grid-template-columns: 1fr 1fr
          grid-gap: 8px
      card_param: cards
      filter:
        template: >
          {% set selected_room_abstract = states('input_text.dynamic_scene_selected') %}
          {% if selected_room_abstract == '' %}
            []
          {% else %}
            {# Map the abstract room to the actual Home Assistant Area or Hue Room name #}
            {% set search_map = {
              'office': 'büro',
              'livingroom': 'wohnzimmer',
              'master': 'schlafzimmer',
              'diningroom': 'esszimmer',
              'childroom': 'kinderzimmer',
              'hallway': 'gang',
              'door': 'eingang',
              'balcony': 'balkon'
            } %}
            {% set search_term = search_map.get(selected_room_abstract, 'unknown') %}

            {# Find all Hue 'scene' entities containing this room name in their ID or Friendly Name #}
            {% set entities = [] %}
            {% for state in states.scene %}
              {% set e_id = state.entity_id | lower %}
              {% set f_name = state.attributes.friendly_name | lower | default('') %}
              {% if search_term in e_id or search_term in f_name %}
                {% set display_name = state.attributes.friendly_name | default(state.entity_id) %}
                {# Clean up the display name for the button so it just says "Hell" instead of "Büro Hell" #}
                {% set display_name = display_name|replace('Büro ', '')|replace('Wohnzimmer ', '')|replace('Schlafzimmer ', '')|replace('Esszimmer ', '')|replace('Kinderzimmer ', '')|replace('Gang ', '')|replace('Eingang ', '')|replace('Balkon ', '') %}
                
                {% set entities = entities + [
                  {
                    'type': 'custom:mushroom-entity-card',
                    'entity': state.entity_id,
                    'name': display_name,
                    'icon_color': 'var(--md-sys-color-primary)',
                    'layout': 'horizontal',
                    'tap_action': {
                      'action': 'call-service',
                      'service': 'scene.turn_on',
                      'data': {
                        'entity_id': state.entity_id
                      }
                    }
                  }
                ] %}
              {% endif %}
            {% endfor %}
            {{ entities | tojson }}
          {% endif %}
      show_empty: false

    # ROOM SELECTOR POPUP/CHIPS
    - type: vertical-stack
      cards:
        # Row 1: Büro, Wohnzimmer, Schlafzimmer
        - type: horizontal-stack
          cards:
            - type: custom:mushroom-template-card
              icon: m3of:computer
              primary: Büro
              tap_action:
                action: call-service
                service: input_text.set_value
                data:
                  entity_id: input_text.dynamic_scene_selected
                  value: 'office'
              color: >-
                {% if states('input_text.dynamic_scene_selected') == 'office' %}
                  var(--md-sys-color-primary)
                {% else %}
                  var(--md-sys-color-outline-variant)
                {% endif %}
            - type: custom:mushroom-template-card
              icon: m3of:weekend
              primary: Wohnzimmer
              tap_action:
                action: call-service
                service: input_text.set_value
                data:
                  entity_id: input_text.dynamic_scene_selected
                  value: 'livingroom'
              color: >-
                {% if states('input_text.dynamic_scene_selected') == 'livingroom' %}
                  var(--md-sys-color-primary)
                {% else %}
                  var(--md-sys-color-outline-variant)
                {% endif %}
            - type: custom:mushroom-template-card
              icon: m3of:bed
              primary: Schlafzimmer
              tap_action:
                action: call-service
                service: input_text.set_value
                data:
                  entity_id: input_text.dynamic_scene_selected
                  value: 'master'
              color: >-
                {% if states('input_text.dynamic_scene_selected') == 'master' %}
                  var(--md-sys-color-primary)
                {% else %}
                  var(--md-sys-color-outline-variant)
                {% endif %}
        
        # Row 2: Esszimmer, Kinderzimmer, Gang
        - type: horizontal-stack
          cards:
            - type: custom:mushroom-template-card
              icon: m3of:restaurant
              primary: Esszimmer
              tap_action:
                action: call-service
                service: input_text.set_value
                data:
                  entity_id: input_text.dynamic_scene_selected
                  value: 'diningroom'
              color: >-
                {% if states('input_text.dynamic_scene_selected') == 'diningroom' %}
                  var(--md-sys-color-primary)
                {% else %}
                  var(--md-sys-color-outline-variant)
                {% endif %}
            - type: custom:mushroom-template-card
              icon: m3of:child-care
              primary: Kinderzimmer
              tap_action:
                action: call-service
                service: input_text.set_value
                data:
                  entity_id: input_text.dynamic_scene_selected
