- type: grid
  cards:
    - type: custom:mushroom-title-card
      subtitle: Select an active room to view available scenes
      title: ""
    
    # DYNAMIC SCENE GENERATOR
    - type: custom:auto-entities
      card:
        type: custom:layout-card
        layout_type: custom:grid-layout # Use grid for side-by-side buttons
        layout:
          grid-template-columns: 1fr 1fr
          grid-gap: 8px
      card_param: cards
      filter:
        template: >
          {% set selected_room = states('input_text.dynamic_scene_selected') %}
          {% if selected_room == '' %}
            {# If no room is selected, display nothing #}
            []
          {% else %}
            {# Map the selected abstract room to actual Home Assistant Areas #}
            {% set area_map = {
              'dining': 'Esszimmer',
              'sofa': 'Wohnzimmer',
              'schlafzimmer': 'Schlafzimmer',
              'baby_room': 'Kinderzimmer',
              'single_guest_room': 'Gästezimmer'
            } %}
            {% set active_area = area_map.get(selected_room, 'Unknown') %}

            {# Find all Hue 'scene' entities in that area #}
            {% set entities = [] %}
            {% for state in states.scene %}
              {% if area_id(state.entity_id) == area_id(active_area) %}
                {% set entities = entities + [
                  {
                    'type': 'custom:mushroom-entity-card',
                    'entity': state.entity_id,
                    'icon_color': 'var(--md-sys-color-primary)',
                    'layout': 'horizontal',
                    'tap_action': {
                      'action': 'call-service',
                      'service': 'scene.turn_on',
                      'data': {
                        'entity_id': state.entity_id
                      }
                    }
                  }
                ] %}
              {% endif %}
            {% endfor %}
            {{ entities | tojson }}
          {% endif %}
      show_empty: false

    # ROOM SELECTOR POPUP/CHIPS
    - type: vertical-stack
      cards:
        - type: horizontal-stack
          cards:
            - type: custom:mushroom-template-card
              icon: m3of:table-restaurant
              primary: Esszimmer
              tap_action:
                action: call-service
                service: input_text.set_value
                data:
                  entity_id: input_text.dynamic_scene_selected
                  value: 'dining'
              color: >-
                {% if states('input_text.dynamic_scene_selected') == 'dining' %}
                  #d53e4f
                {% else %}
                  var(--md-sys-color-outline-variant)
                {% endif %}
            - type: custom:mushroom-template-card
              icon: m3of:weekend
              primary: Wohnzimmer
              tap_action:
                action: call-service
                service: input_text.set_value
                data:
                  entity_id: input_text.dynamic_scene_selected
                  value: 'sofa'
              color: >-
                {% if states('input_text.dynamic_scene_selected') == 'sofa' %}
                  #fc8d59
                {% else %}
                  var(--md-sys-color-outline-variant)
                {% endif %}
        - type: horizontal-stack
          cards:
            - type: custom:mushroom-template-card
              icon: m3of:bed
              primary: Schlafzimmer
              tap_action:
                action: call-service
                service: input_text.set_value
                data:
                  entity_id: input_text.dynamic_scene_selected
                  value: 'schlafzimmer'
              color: >-
                {% if states('input_text.dynamic_scene_selected') == 'schlafzimmer' %}
                  var(--md-sys-color-primary)
                {% else %}
                  var(--md-sys-color-outline-variant)
                {% endif %}
            - type: custom:mushroom-template-card
              icon: m3of:child-care
              primary: Kinderzimmer
              tap_action:
                action: call-service
                service: input_text.set_value
                data:
                  entity_id: input_text.dynamic_scene_selected
                  value: 'baby_room'
              color: >-
                {% if states('input_text.dynamic_scene_selected') == 'baby_room' %}
                  #e6f598
                {% else %}
                  var(--md-sys-color-outline-variant)
                {% endif %}
        - type: horizontal-stack
          cards:
            - type: custom:mushroom-template-card
              icon: m3of:luggage
              primary: Gästezimmer
              tap_action:
                action: call-service
                service: input_text.set_value
                data:
                  entity_id: input_text.dynamic_scene_selected
                  value: 'single_guest_room'
              color: >-
                {% if states('input_text.dynamic_scene_selected') == 'single_guest_room' %}
                  var(--md-sys-color-tertiary)
                {% else %}
                  var(--md-sys-color-outline-variant)
                {% endif %}