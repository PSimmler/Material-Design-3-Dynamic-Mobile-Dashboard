                  entity_id: input_text.dynamic_scene_selected
                  value: 'balcony'
              color: >-
                {% if states('input_text.dynamic_scene_selected') == 'balcony' %}
                  var(--md-sys-color-primary)
                {% else %}
                  var(--md-sys-color-outline-variant)
                {% endif %}
    - type: custom:decluttering-card
      template: navbar_card
