- type: grid
  cards:
    - type: custom:mushroom-title-card
      subtitle: Select an active room to view available scenes
      title: ""
    
    # DYNAMIC SCENE GENERATOR
    - type: custom:auto-entities
      card:
        type: custom:layout-card
        layout_type: custom:grid-layout # Use grid for side-by-side buttons
        layout:
          grid-template-columns: 1fr 1fr
          grid-gap: 8px
      card_param: cards
      filter:
        template: >
          {% set selected_room = states('input_text.dynamic_scene_selected') %}
          {% if selected_room == '' %}
            {# If no room is selected, display nothing #}
            []
          {% else %}
            {# Map the selected abstract room to actual Home Assistant Areas #}
            {% set area_map = {
              'office': 'Büro',
              'livingroom': 'Wohnzimmer',
              'master': 'Schlafzimmer',
              'diningroom': 'Esszimmer',
              'childroom': 'Kinderzimmer',
              'hallway': 'Gang',
              'door': 'Eingang',
              'balcony': 'Balkon'
            } %}
            {% set active_area = area_map.get(selected_room, 'Unknown') %}

            {# Find all Hue 'scene' entities in that area #}
            {% set entities = [] %}
            {% for state in states.scene %}
              {% if area_id(state.entity_id) == area_id(active_area) %}
                {% set entities = entities + [
                  {
                    'type': 'custom:mushroom-entity-card',
                    'entity': state.entity_id,
                    'icon_color': 'var(--md-sys-color-primary)',
                    'layout': 'horizontal',
                    'tap_action': {
                      'action': 'call-service',
                      'service': 'scene.turn_on',
                      'data': {
                        'entity_id': state.entity_id
                      }
                    }
                  }
                ] %}
              {% endif %}
            {% endfor %}
            {{ entities | tojson }}
          {% endif %}
      show_empty: false

    # ROOM SELECTOR POPUP/CHIPS
    - type: vertical-stack
      cards:
        # Row 1: Büro, Wohnzimmer, Schlafzimmer
        - type: horizontal-stack
          cards:
            - type: custom:mushroom-template-card
              icon: m3of:computer
              primary: Büro
              tap_action:
                action: call-service
                service: input_text.set_value
                data:
                  entity_id: input_text.dynamic_scene_selected
                  value: 'office'
              color: >-
                {% if states('input_text.dynamic_scene_selected') == 'office' %}
                  var(--md-sys-color-primary)
                {% else %}
                  var(--md-sys-color-outline-variant)
                {% endif %}
            - type: custom:mushroom-template-card
              icon: m3of:weekend
              primary: Wohnzimmer
              tap_action:
                action: call-service
                service: input_text.set_value
                data:
                  entity_id: input_text.dynamic_scene_selected
                  value: 'livingroom'
              color: >-
                {% if states('input_text.dynamic_scene_selected') == 'livingroom' %}
                  #fc8d59
                {% else %}
                  var(--md-sys-color-outline-variant)
                {% endif %}
            - type: custom:mushroom-template-card
              icon: m3of:bed
              primary: Schlafzimmer
              tap_action:
                action: call-service
                service: input_text.set_value
                data:
                  entity_id: input_text.dynamic_scene_selected
                  value: 'master'
              color: >-
                {% if states('input_text.dynamic_scene_selected') == 'master' %}
                  #e6f598
                {% else %}
                  var(--md-sys-color-outline-variant)
                {% endif %}
        
        # Row 2: Esszimmer, Kinderzimmer, Gang
        - type: horizontal-stack
          cards:
            - type: custom:mushroom-template-card
              icon: m3of:restaurant
              primary: Esszimmer
              tap_action:
                action: call-service
                service: input_text.set_value
                data:
                  entity_id: input_text.dynamic_scene_selected
                  value: 'diningroom'
              color: >-
                {% if states('input_text.dynamic_scene_selected') == 'diningroom' %}
                  #d53e4f
                {% else %}
                  var(--md-sys-color-outline-variant)
                {% endif %}
            - type: custom:mushroom-template-card
              icon: m3of:child-care
              primary: Kinderzimmer
              tap_action:
                action: call-service
                service: input_text.set_value
                data:
                  entity_id: input_text.dynamic_scene_selected
                  value: 'childroom'
              color: >-
                {% if states('input_text.dynamic_scene_selected') == 'childroom' %}
                  var(--md-sys-color-tertiary)
                {% else %}
                  var(--md-sys-color-outline-variant)
                {% endif %}
            - type: custom:mushroom-template-card
              icon: m3of:hallway
              primary: Gang
              tap_action:
                action: call-service
                service: input_text.set_value
                data:
                  entity_id: input_text.dynamic_scene_selected
                  value: 'hallway'
              color: >-
                {% if states('input_text.dynamic_scene_selected') == 'hallway' %}
                  var(--md-sys-color-primary)
                {% else %}
                  var(--md-sys-color-outline-variant)
                {% endif %}

        # Row 3: Eingang, Balkon
        - type: horizontal-stack
          cards:
            - type: custom:mushroom-template-card
              icon: m3of:door_front
              primary: Eingang
              tap_action:
                action: call-service
                service: input_text.set_value
                data:
                  entity_id: input_text.dynamic_scene_selected
                  value: 'door'
              color: >-
                {% if states('input_text.dynamic_scene_selected') == 'door' %}
                  #fc8d59
                {% else %}
                  var(--md-sys-color-outline-variant)
                {% endif %}
            - type: custom:mushroom-template-card
              icon: m3of:garden
              primary: Balkon
              tap_action:
                action: call-service
                service: input_text.set_value
                data:
                  entity_id: input_text.dynamic_scene_selected
                  value: 'balcony'
              color: >-
                {% if states('input_text.dynamic_scene_selected') == 'balcony' %}
                  #e6f598
                {% else %}
                  var(--md-sys-color-outline-variant)
                {% endif %}
    - type: custom:decluttering-card
      template: navbar_card
