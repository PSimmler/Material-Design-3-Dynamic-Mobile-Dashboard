              color: >-
                {% if states('input_text.dynamic_scene_selected') == 'childroom' %}
                  var(--md-sys-color-primary)
                {% else %}
                  var(--md-sys-color-outline-variant)
                {% endif %}
            - type: custom:mushroom-template-card
              icon: m3of:hallway
              primary: Gang
              tap_action:
                action: call-service
                service: input_text.set_value
                data:
                  entity_id: input_text.dynamic_scene_selected
                  value: 'hallway'
              color: >-
                {% if states('input_text.dynamic_scene_selected') == 'hallway' %}
                  var(--md-sys-color-primary)
                {% else %}
                  var(--md-sys-color-outline-variant)
                {% endif %}

        # Row 3: Eingang, Balkon
        - type: horizontal-stack
          cards:
            - type: custom:mushroom-template-card
              icon: m3of:door
              primary: Eingang
              tap_action:
                action: call-service
                service: input_text.set_value
                data:
                  entity_id: input_text.dynamic_scene_selected
                  value: 'door'
              color: >-
                {% if states('input_text.dynamic_scene_selected') == 'door' %}
                  var(--md-sys-color-primary)
                {% else %}
                  var(--md-sys-color-outline-variant)
                {% endif %}
            - type: custom:mushroom-template-card
              icon: m3of:balcony
              primary: Balkon
              tap_action:
                action: call-service
                service: input_text.set_value
