- type: custom:mini-media-player
  entity: media_player.buro_roam
  hide:
    icon: true
    name: true
    runtime: true
    source: true
    power: true
    state_label: true
    volume: true
    info: true
    progress: false
    controls: true
  more_info: false
  toggle_power: false
  group: true
  card_mod:
    style: |
      ha-card {
        
        /* STATIC VALUES for Move progress bar up into gap 
           (ersetzt die dynamische Berechnung mit statischen Werten 
           basierend auf den Standardwerten 12px und -25px) */
        bottom: 11px; # calc(3 * 12px + -25px)
        
        /* STATIC VALUES for Correct margins for progress bar */
        margin: 0px 19.4px -12px; # calc(1.618 * 12px)
        
        /* Set height of card to match pregress bar height */
        height: 12px; # <-- Ersetzt var(--mush-spacing) durch 12px

        /* Remove border outline */
        --ha-card-border-width: 0;

        /* Round corners of progress bar */
        --mmp-border-radius: var(--control-border-radius, 12px) !important;

        /* Set height of progress bar */
        --mmp-progress-height: 12px !important; # <-- Ersetzt var(--mush-spacing) durch 12px

        /* Make progress bar adjust to use dynamic theming */
        --mmp-accent-color: var(--md-sys-color-tertiary) !important;

        /* Remove transitions to prevent progress bar floating in */
        transition: all 0s;
      }
- type: grid
  cards:
    - type: custom:decluttering-card
      template: navbar_card        