- type: grid
  cards:
    - type: custom:simple-tabs
      pre-load: true
      active-background: var(--md-sys-color-tertiary)
      active-text-color: var(--md-sys-color-on-tertiary)
      tabs:
        - title: Lichter
          icon: m3of:home
          card:
            type: vertical-stack
            cards:
              - type: custom:decluttering-card
                template: mushroom_title_card
                variables:
                  - title: Raum
              - type: custom:material-slider-card
                entity: light.buro
                icon: m3of:lightbulb
                show_percentage: true
                bold_text: false
                control_type: light
              - type: custom:decluttering-card
                template: mushroom_title_card
                variables:
                  - title: Einzelne Lichter
              - type: horizontal-stack
                cards:
                  - type: custom:material-slider-card
                    entity: light.buro_decke
                    icon: m3of:lightbulb
                    show_percentage: true
                    bold_text: false
                    control_type: light
        - title: Musik
          icon: m3of:play-circle
          card:
            type: vertical-stack
            cards:
              - type: custom:decluttering-card
                template: mushroom_title_card
                variables:
                  - title: Büro/Roam
              - type: custom:decluttering-card
                template: media_player_card
                variables:
                  - entity: media_player.buro_roam
                  - icon: m3of:play-circle
                  - tap_action: more-info
- type: grid
  cards:
    - type: custom:decluttering-card
      template: navbar_card                  