- type: grid
  cards:
    - type: custom:paper-buttons-row
      styles:
        gap: 8px
        justify-content: flex-start
        overflow: scroll
        margin: 12px 0 12px -18px
        padding-left: 18px
        width: calc(100% + 36px)
      extra_styles: |
        ::-webkit-scrollbar {
          display: none;
        }
    - type: custom:simple-tabs
      pre-load: true
      active-background: var(--md-sys-color-tertiary)
      active-text-color: var(--md-sys-color-on-tertiary)
      tabs:
        - title: Lichter
          icon: m3of:home
          card:
            type: vertical-stack
            cards:
              - type: custom:decluttering-card
                template: mushroom_title_card
                variables:
                  - title: Raum
              - type: custom:material-slider-card
                entity: light.esszimmer
                icon: m3of:lightbulb
                show_percentage: true
                bold_text: false
                control_type: light
              - type: custom:decluttering-card
                template: mushroom_title_card
                variables:
                  - title: Einzelne Lichter
              - type: horizontal-stack
                cards:
                  - type: custom:material-slider-card
                    entity: light.esszimmer_decke_unten
                    icon: m3of:lightbulb
                    show_percentage: true
                    bold_text: false
                    control_type: light
                  - type: custom:material-slider-card
                    entity: light.esszimmer_decke_oben
                    icon: m3of:lightbulb
                    show_percentage: true
                    bold_text: false
                    control_type: light
              - type: horizontal-stack
                cards:
                  - type: custom:material-slider-card
                    entity: light.esszimmer_decke_garderobe
                    icon: m3of:lightbulb
                    show_percentage: true
                    bold_text: false
                    control_type: light
                  - type: custom:material-slider-card
                    entity: light.zurilicht
                    icon: m3of:lightbulb
                    show_percentage: true
                    bold_text: false
                    control_type: light
        - title: Musik
          icon: m3of:play-circle
          card:
            type: vertical-stack
            cards:
              - type: custom:decluttering-card
                template: mushroom_title_card
                variables:
                  - title: Esszimmer Play 5
              - type: custom:decluttering-card
                template: media_player_card
                variables:
                  - entity: media_player.esszimmer
                  - icon: m3of:play-circle
                  - tap_action: more-info
