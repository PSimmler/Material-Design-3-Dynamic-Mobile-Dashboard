layout: responsive
badges_position: bottom
badges_wrap: wrap
card:
  type: horizontal-stack
  cards:
    - type: custom:decluttering-card
      template: mushroom_overview_card
      variables:
        - subtitle: "{{ now().strftime('%a %b %-d - %I:%M %p') }}"
    - type: custom:mushroom-chips-card
      chips:
        - type: conditional
          conditions:
            - condition: state
              entity: sensor.latest_nearby_quake
              state_not: No quake
          chip:
            type: template
            entity: sensor.latest_nearby_quake
            tap_action:
              action: navigate
              navigation_path: "#earthquake-warning"
            icon: m3of:globe-location-pin
            icon_color: >
              {% set mag = state_attr('sensor.latest_nearby_quake',
              'magnitude') | float(0) %} {% if mag >= 6.0 %} #D32F2F {%
              elif mag >= 5.0 %} #F4511E {% elif mag >= 4.0 %} #FB8C00 {%
              elif mag >= 3.0 %} #F9A825 {% elif mag >= 2.0 %} #FBC02D {%
              else %} #388E3C {% endif %}
        - type: conditional
          conditions:
            - condition: numeric_state
              entity: sensor.volcano_rotorua
              above: 0
          chip:
            type: template
            entity: sensor.volcano_rotorua
            tap_action:
              action: navigate
              navigation_path: "#volcano-warning"
            icon: m3of:mountain-steam
            icon_color: |
              {% set level = states('sensor.volcano_rotorua') | int %}
              {% if level == 5 %} red
              {% elif level == 4 %} deep-orange
              {% elif level == 3 %} orange
              {% elif level == 2 %} amber
              {% elif level == 1 %} yellow
              {% else %} green
              {% endif %}
        - type: conditional
          conditions:
            - condition: state
              entity: sensor.home_metservice_weather_warnings
              state_not: unknown
          chip:
            type: template
            entity: sensor.home_metservice_weather_warnings
            tap_action:
              action: navigate
              navigation_path: "#weather-warning"
            icon: m3of:warning
            icon_color: orange
        - type: conditional
          conditions:
            - entity: alarm_control_panel.alarmo
              state: triggered
          chip:
            type: template
            entity: alarm_control_panel.alarmo
            content: Triggered
            tap_action:
              action: navigate
              navigation_path: "#alarmo"
            icon: m3of:notifications-active
            icon_color: "#d14f3a"
        - type: conditional
          conditions:
            - entity: alarm_control_panel.alarmo
              state: armed_away
          chip:
            type: template
            entity: alarm_control_panel.alarmo
            content: Armed away
            tap_action:
              action: navigate
              navigation_path: "#alarmo"
            icon: mdi:shield-lock
            icon_color: "#69ac5a"
        - type: conditional
          conditions:
            - entity: alarm_control_panel.alarmo
              state: arming
          chip:
            type: template
            entity: alarm_control_panel.alarmo
            content: Arming
            tap_action:
              action: navigate
              navigation_path: "#alarmo"
            icon: mdi:shield
            icon_color: "#efa340"
        - type: conditional
          conditions:
            - entity: alarm_control_panel.alarmo
              state: pending
          chip:
            type: template
            entity: alarm_control_panel.alarmo
            content: Pending
            tap_action:
              action: navigate
              navigation_path: "#alarmo"
            icon: mdi:shield-outline
            icon_color: "#efa340"
        - type: conditional
          conditions:
            - entity: alarm_control_panel.alarmo
              state: disarmed
          chip:
            type: template
            entity: alarm_control_panel.alarmo
            tap_action:
              action: navigate
              navigation_path: "#alarmo"
            icon: mdi:shield-off
            icon_color: "#disarmed"
        - type: template
          entity: sensor.active_notification_count
          icon: m3of:notifications
          tap_action:
            action: navigate
            navigation_path: "#notifications"
          hold_action:
            action: none
          card_mod:
            style: >
              ha-card {
                position: relative;
              }

              {% set notifications =
              states('sensor.active_notification_count') | int %}

              {% if notifications > 0 %}

              ha-card:after {
                content: "{{ notifications }}";
                position: absolute;
                top: -3px;
                right: -3px;
                background-color: var(--md-sys-color-primary);
                color: var(--md-sys-color-on-primary);
                border-radius: 50%;
                width: 16px;
                height: 16px;
                font-size: 10px;
                line-height: 16px;
                text-align: center;
                display: inline-block;
                font-weight: bold;
              } {% endif %}
      alignment: end
      card_mod:
        style: |
          ha-card {
            margin-top: 1.2em
          }
