- type: grid
  cards:
    - type: vertical-stack
      cards:
        - type: custom:decluttering-card
          template: mushroom_title_subtitle_card
          variables:
            - title: Proxmox
            - subtitle: >-
                {% set cpu = states('sensor.node_pve_cpu_used') | float(0)
                %}{% set mem =
                states('sensor.node_pve_memory_used_percentage') |
                float(0) %}{% set temp =
                states('sensor.disk_pve_bc511_nvme_sk_hynix_256gb_temperature')
                | float(0) %}{% if cpu > 75 or mem > 75 or temp > 70 %}🟥
                CPU: {{ cpu | round(1) }}% • Memory: {{ mem | round(1) }}%
                • NVMe: {{ temp | round(1) }}°C{% elif cpu > 50 or mem >
                50 or temp > 55 %}🟧 CPU: {{ cpu | round(1) }}% • Memory:
                {{ mem | round(1) }}% • NVMe: {{ temp | round(1) }}°C{%
                else %}🟩 CPU: {{ cpu | round(1) }}% • Memory: {{ mem |
                round(1) }}% • NVMe: {{ temp | round(1) }}°C{% endif %}
        - type: horizontal-stack
          cards:
            - type: gauge
              entity: sensor.disk_pve_bc511_nvme_sk_hynix_256gb_temperature
              name: SSD Temperature
              min: 20
              max: 80
              severity:
                green: 40
                yellow: 55
                red: 70
              unit: °C
            - type: gauge
              entity: sensor.node_pve_memory_used
              name: Memory Used
              max: 16.57
              severity:
                green: 6
                yellow: 8
                red: 12
        - type: custom:decluttering-card
          template: mushroom_title_subtitle_card
          variables:
            - title: HA OS
            - subtitle: >-
                {% set cpu = states('sensor.qemu_haos14_2_100_cpu_used') |
                float(0) %}{% set mem =
                states('sensor.qemu_haos14_2_100_memory_used') | float(0)
                %}{% set health =
                states('binary_sensor.qemu_haos14_2_100_health') %}{% set
                boot = states('sensor.qemu_haos14_2_100_last_boot') %}{%
                if cpu > 75 or mem > 75 or health == 'on' %}🟥{% elif cpu
                > 50 or mem > 50 %}🟧{% else %}🟩{% endif %} CPU: {{ cpu |
                round(1) }}% • MEM: {{ mem | round(1)
                }}%                                                                                      
                Health: {{ 'OK' if health == 'off' else '❌'}} • Last Boot:
                {{ as_timestamp(boot) | timestamp_custom('%d %b %H:%M') }}
        - type: horizontal-stack
          cards:
            - type: gauge
              entity: sensor.qemu_haos14_2_100_memory_free
              name: Memory Free
              max: 8.59
              severity:
                green: 6
                yellow: 3
                red: 0
            - type: gauge
              entity: sensor.qemu_haos14_2_100_memory_used
              name: Memory Used
              max: 8.59
              severity:
                green: 3
                yellow: 4
                red: 6
- type: grid
  cards:
    - type: vertical-stack
      cards:
        - type: custom:decluttering-card
          template: mushroom_title_subtitle_card
          variables:
            - title: Network
            - subtitle: >-
                {% set dl = states('sensor.download_speed_mbps') |
                float(0) %}{% set ul = states('sensor.upload_speed_mbps')
                | float(0) %}{% set ping =
                states('sensor.ping_latency_ms') | float(0) %}{% if dl <
                10 or ul < 2 %}🟥 Download: {{ dl | round(1) }} Mbps •
                Upload: {{ ul | round(1) }} Mbps • Ping: {{ ping |
                round(0) }} ms{% elif dl < 30 or ul < 5 %}🟧 Download: {{
                dl | round(1) }} Mbps • Upload: {{ ul | round(1) }} Mbps •
                Ping: {{ ping | round(0) }} ms{% else %}🟩 Download: {{ dl
                | round(1) }} Mbps • Upload: {{ ul | round(1) }} Mbps •
                Ping: {{ ping | round(0) }} ms{% endif %}
        - type: custom:apexcharts-card
          header:
            show: true
            show_states: true
            colorize_states: true
          graph_span: 24h
          span:
            end: minute
          apex_config:
            chart:
              height: 180
              toolbar:
                show: false
            stroke:
              width: 2
            legend:
              show: false
            fill:
              type: gradient
              gradient:
                shadeIntensity: 0.4
                opacityFrom: 0.5
                opacityTo: 0
                stops:
                  - 0
                  - 90
                  - 100
          series:
            - entity: sensor.download_speed_mbps
              name: Download
              color: '#42a5f5'
              type: area
            - entity: sensor.upload_speed_mbps
              name: Upload
              color: '#66bb6a'
              type: area
    - type: vertical-stack
      cards:
        - type: custom:decluttering-card
          template: mushroom_title_card
          variables:
            - title: Devices
        - type: custom:auto-entities
          card:
            type: grid
            square: false
            columns: 1
          card_param: cards
          filter:
            include:
              - entity_id: '*battery*'
                state: < 60
                options:
                  type: custom:mushroom-template-card
                  icon: |
                    {% set v = states(entity) | default(0) | int %}
                    {% if v < 10 %}
                      mdi:battery-alert-variant-outline
                    {% elif v < 25 %}
                      mdi:battery-10
                    {% elif v < 40 %}
                      mdi:battery-30
                    {% elif v < 60 %}
                      mdi:battery-50
                    {% endif %}
                  primary: |
                    {{ states(entity) }}%
                  secondary: |
                    {{ state_attr(entity, 'friendly_name') }} -
                          updated: {{ relative_time(states[entity].last_updated) }} ago
                  icon_color: |
                    {% set v = states(entity) | default(0) | int %}
                    {% if v < 25 %}
                      red
                    {% elif v < 60 %}
                      yellow
                    {% endif %}
                  card_mod:
                    style:
                      mushroom-shape-icon$: |
                        .shape {
                          --shape-color: transparent !important;
                        }
          show_empty: false
          sort:
            method: friendly_name
- type: grid
  cards:
    - type: custom:decluttering-card
      template: navbar_card            