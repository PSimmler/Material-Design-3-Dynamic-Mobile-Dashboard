- type: entities
  entities:
  - &chip_style |
      ha-card {
        --chip-background: {% if is_state(config.entity, 'on') %} #D3C890 {% else %} #353535 {% endif %};
        --color: {% if is_state(config.entity, 'on') %} #5b5326 {% else %} #dbdbdb {% endif %};
        justify-content: center;
        height: 35px !important;
        width: 35px !important;
        border: 0 !important;
        box-shadow: none !important;
        border-radius: 22px !important;
      }
  - &big_room_card_style |
      ha-card {
        background:
        {% set entity_id = config.entity | default('') %}
        {% set temp = states(config.entity) | float %}
        {% if temp < 13 %}
          rgba(172, 156, 175, 0.8)
        {% elif temp < 16 %}
          rgba(215, 196, 219, 0.8)
        {% elif temp < 19 %}
          rgba(163, 217, 245, 0.8)
        {% elif temp < 22 %}
          rgba(205, 227, 219, 0.8)
        {% elif temp < 24 %}
          rgba(255, 229, 153, 0.8)
        {% elif temp < 27 %}
          rgba(247, 190, 129, 0.8)
        {% else %}
          rgba(224, 102, 102, 0.8)
        {% endif %}
        
        max-width: 100%;
        min-width: 50%;
        height: 186px;
      }      
- type: grid
  cards:
    - type: horizontal-stack
      cards:
        - type: custom:stack-in-card
          mode: horizontal
          cards:
            - type: vertical-stack
              cards:
                - type: custom:decluttering-card
                  template: room_summary_card
                  variables:
                    - room_name: Büro
                    - navigation_path: office
                - type: custom:decluttering-card
                  template: big_icon_toggle_card
                  variables:
                    - entity: light.buro
                    - icon: m3of:computer
            - type: custom:mushroom-chips-card
              chips:
                - type: custom:decluttering-card
                  template: icon_chip_template
                  variables:
                    - entity: light.buro_decke
                    - icon: m3of:lightbulb_2
                - type: template
                  entity: light.buro_decke
                  tap_action:
                    action: toggle
                  icon: m3of:lightbulb
                  card_mod:
                    style: *chip_style
              card_mod:
                style: |
                  .chip-container {
                    flex-flow: column wrap-reverse !important;
                    display: flex !important;
                    --chip-spacing: 8px;
                    margin: 12px;
                  }
                  .: |
                  .container {
                    align: end;
                  }
          card_mod:
            style: *big_room_card_style
